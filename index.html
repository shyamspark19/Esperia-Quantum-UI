<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESPERIA | Cloud-Native. AI-Driven.</title>
  <meta name="description" content="From modern cloud architecture to AI-powered experiences, we engineer digital products that are scalable, secure, resilient, and built to move fast." />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
            display: ['Parkinsans', 'sans-serif'],
            sora: ['Sora', 'sans-serif'],
            orbitron: ['Orbitron', 'sans-serif'],
            space: ['Space Grotesk', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Dancing+Script:wght@500;600;700&family=Great+Vibes&family=Manrope:wght@300;400;500;600;700;800&family=Orbitron:wght@600;700;800;900&family=Parkinsans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,400;1,600;1,700&family=Satisfy&family=Sora:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F6F6F3;
      color: #0A0A0A;
      font-family: 'Manrope', sans-serif;
    }
    .font-sora {
      font-family: 'Sora', sans-serif;
    }
    .font-parkinsans {
      font-family: 'Parkinsans', sans-serif;
    }
    .font-manrope {
      font-family: 'Manrope', sans-serif;
    }
    .text-gradient-creative {
      background: linear-gradient(90deg, #BF3854 0%, #3EA594 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .text-gradient-ai {
      background: linear-gradient(90deg, #C5465B 0%, #C5465B 25.5%, #27C2A0 71.2%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .text-gradient-transform {
      background: linear-gradient(90deg, #C5445A 0%, #3EA594 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .text-gradient-ingenuity {
      background: linear-gradient(90deg, #8A9292 0%, #3EA594 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .text-gradient-impact {
      background: linear-gradient(90deg, #9C727D 0%, #5E8980 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .text-gradient-stats {
      background: linear-gradient(180deg, #C95E58 0%, #DB7A68 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .bg-hero-gradient {
      background: linear-gradient(135deg, #264240 0%, #041B19 60%, #020F0F 100%);
    }
    .bg-enterprise-banner {
      background: linear-gradient(90deg, #5D7F72 0%, #678B7D 20%, #D67C65 100%);
    }
    .bg-talk-button {
      background: linear-gradient(90deg, #FF7E8B 0%, #F2576B 100%);
    }

<body class="min-h-screen bg-[#F6F6F3] text-[#0A0A0A] font-sans antialiased selection:bg-[#C5445A] selection:text-white">

  <!-- React Root Container -->
  <div id="root"></div>

  <!-- Vite React Module Mount -->
  <script type="module" src="/main.tsx"></script>

</body>
</html>
